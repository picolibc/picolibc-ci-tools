name: Build QEMU

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - '.github/workflows/build-qemu.yaml'
      - 'patches/qemu/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-qemu.yaml'
      - 'patches/qemu/**'
  workflow_dispatch:

# When a PR is updated, cancel the jobs from the previous version. Merges
# do not define head_ref, so use run_id to never cancel those jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
    contents: write

env:
  PLATFORM: "linux-amd64"

jobs:
  build-qemu:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            target-list: "loongarch64-softmmu,m68k-softmmu,mips-softmmu,mipsel-softmmu,mips64-softmmu,mips64el-softmmu,rx-softmmu"
            repository: qemu/qemu
            ref: v11.1.3
            patchdir: patches/qemu/11.1.3
            extra-args: "--enable-relocatable"
          - variant: "9.0" # For NIOS2, dropped in 9.1
            target-list: "nios2-softmmu"
            repository: qemu/qemu
            ref: v9.0.4
            # The bundled dtc forces -Werror, which GCC 15 trips over
            extra-args: "--enable-relocatable --extra-cflags=-Wno-error=discarded-qualifiers"
          - variant: hexagon
            target-list: "hexagon-linux-user,hexagon-softmmu"
            repository: qualcomm/qemu
            ref: hexagon-sysemu-23-apr-2026

    steps:
      - uses: actions/checkout@v4

      - name: "prereq Linux"
        run: |
          sudo apt update && sudo apt install -y ninja-build python3-sphinx python3-sphinx-rtd-theme libglib2.0-dev libpixman-1-dev

      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: qemu

      - name: "Apply patches"
        if: matrix.patchdir != ''
        run: |
          cd qemu
          git apply ${{ github.workspace }}/${{ matrix.patchdir }}/*.patch

      - name: Build qemu
        run: |
          mkdir -p ${{ github.workspace }}/qemu-${{ matrix.variant }}
          mkdir build
          cd build
          ../qemu/configure --target-list=${{ matrix.target-list }} --without-default-features --enable-tcg --enable-system --static --disable-werror --prefix=${{ github.workspace }}/qemu-${{ matrix.variant }} ${{ matrix.extra-args }}
          make install -j$(nproc)

      - name: Pack toolchain tarball
        run: |
          tar -C ${{ github.workspace }} \
              -cvf qemu-${{ matrix.variant }}.${{ env.PLATFORM }}.tar.xz qemu-${{ matrix.variant }}

      - name: Upload toolchain tarball
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.variant }}.${{ env.PLATFORM }}.tar.xz
          path: qemu-${{ matrix.variant }}.${{ env.PLATFORM }}.tar.xz

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qemu-${{ matrix.variant }}.${{ env.PLATFORM }}.tar.xz
